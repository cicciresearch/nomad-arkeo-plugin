site_name: ARKEO NOMAD Plugin
site_description: Documentation for the ARKEO NOMAD Plugin by CICCI Research s.r.l.
site_url: https://cicciresearch.github.io/nomad-arkeo-plugin/
repo_url: https://github.com/cicciresearch/nomad-arkeo-plugin
repo_name: cicciresearch/nomad-arkeo-plugin

theme:
  name: material
  logo: assets/cicci-logo.png
  favicon: assets/cicci-logo.png

nav:
  - Home: index.md
  - Installation: how_to/install_this_plugin.md
  - How to use: how_to/use_this_plugin.md
  - Support: support.md
  - Privacy: privacy.md
  - Release v0.1.0: https://github.com/cicciresearch/nomad-arkeo-plugin/releases/tag/v0.1.0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  generator: false

copyright: >
  © 2026 CICCI Research s.r.l. ·
